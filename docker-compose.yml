name: edplatform

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: edplatform-api:1.0.0
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required, see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      DB_NAME: ${DB_NAME:?DB_NAME is required, see .env.example}
      DB_LOGGING: ${DB_LOGGING:-false}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required, see .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
