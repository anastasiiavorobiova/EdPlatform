services:
  api:
    build:
      target: dev
    image: edplatform-api:dev
    environment:
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - ./src:/app/src:ro

  db:
    ports:
      - "${DB_PUBLISHED_PORT:-5435}:5432"
    volumes:
      # creates edplatform_test for e2e tests on the first start of the volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
